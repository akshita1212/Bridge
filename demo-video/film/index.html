<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bridge film</title>
<link rel="stylesheet" href="../snap/assets/fonts/local.css">
<style>
/* Bridge's own look: paper ground, navy ink, lime accent, Plus Jakarta Sans + DM Mono (src/styles/theme.css, Landing.tsx). */
:root { --ground: #F6F7ED; --fg: #001F3F; --fg2: #4C5A55; --fg3: #8A948C; --accent: #DBE64C; --accent-ink: #4A5200; --green: #00804C;
  --font: "Plus Jakarta Sans", system-ui, sans-serif; --mono: "DM Mono", ui-monospace, monospace; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
body { font-family: var(--font); color: var(--fg); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(70% 70% at 85% 15%, rgba(219,230,76,.28), transparent 60%), radial-gradient(60% 60% at 10% 100%, rgba(0,128,76,.07), transparent 60%), var(--ground); }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.obj { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#desk { width: 1470px; height: 860px; border-radius: 18px; overflow: hidden; background: #F6F7ED;
  box-shadow: 0 0 0 1px rgba(0,31,63,.10), 0 40px 110px -30px rgba(0,31,63,.35), 0 10px 30px rgba(0,31,63,.10); }
#desk iframe { position: absolute; left: 0; top: 0; width: 1470px; height: 860px; border: 0; visibility: hidden; }
#scrim { position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: linear-gradient(90deg, rgba(246,247,237,.98) 0, rgba(246,247,237,.95) 560px, rgba(246,247,237,.6) 650px, rgba(246,247,237,0) 760px); }
#hud { position: absolute; inset: 0; pointer-events: none; }
.cap { position: absolute; left: 112px; top: 0; width: 470px; opacity: 0; }
.cap .num { font: 500 17px/1 var(--mono); letter-spacing: .08em; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
.cap h2 { margin: 18px 0 0; font: 700 54px/1.06 var(--font); letter-spacing: -.035em; color: var(--fg); }
.cap p { margin: 20px 0 0; font: 400 23px/1.45 var(--font); color: var(--fg2); }
.w { display: inline-block; white-space: pre; }
#rail { position: absolute; left: 52px; top: 50%; display: flex; flex-direction: column; align-items: center; gap: 12px; transform: translateY(-50%);
  font: 500 12px/1 var(--mono); color: var(--fg3); opacity: 0; }
#rail i { display: block; width: 14px; height: 2px; border-radius: 1px; background: rgba(0,31,63,.18); }
#rail b { font-weight: 500; color: var(--fg); background: var(--accent); padding: 4px 5px; border-radius: 5px; }
.cursor { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; }
.cursor svg { position: absolute; left: -3px; top: -2px; overflow: visible; }
.cursor .pill { position: absolute; left: 22px; top: 22px; padding: 6px 11px 7px; border-radius: 999px; font: 700 14px/1 var(--font); white-space: nowrap; background: var(--accent); color: var(--fg); box-shadow: 0 2px 8px rgba(0,31,63,.15); }
.ripple { position: absolute; left: 0; top: 0; border-radius: 50%; border: 2px solid rgba(0,31,63,.55); }
.tap { position: absolute; left: 0; top: 0; border-radius: 50%; background: rgba(0,31,63,.12); }
.note { position: absolute; left: 0; top: 0; font: 700 21px/1.2 var(--font); color: var(--fg); white-space: nowrap; opacity: 0; }
.note small { display: block; margin-top: 5px; font: 500 16px/1.25 var(--font); color: var(--fg2); }
#arrows { position: absolute; inset: 0; overflow: visible; color: var(--fg); }
/* title card: the Bridge mark and name (Landing.tsx nav), then the landing headline */
#lockup { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 24px; transform-origin: 50% 50%; white-space: nowrap; }
#lockup .mark { width: 104px; height: 104px; border-radius: 28px; background: var(--accent); display: grid; place-items: center; }
#lockup .name { font: 700 104px/1 var(--font); letter-spacing: -.045em; display: inline-flex; }
#lockup .name span { display: inline-block; }
#title { position: absolute; left: 0; width: 1920px; top: 470px; text-align: center; }
#title h1 { margin: 0; font: 700 88px/1.06 var(--font); letter-spacing: -.04em; }
#title h1 .g { color: var(--green); }
#title p { margin: 26px 0 0; font: 400 32px/1.3 var(--font); color: var(--fg2); }
/* ending: paper rises with the mark, the landing's closing line and its call to action */
#endcard { position: absolute; inset: 0; background: var(--ground); color: var(--fg); visibility: hidden; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 28px; text-align: center; box-shadow: 0 -40px 90px rgba(0,31,63,.18); }
#endcard .mark { width: 88px; height: 88px; border-radius: 24px; background: var(--accent); display: grid; place-items: center; }
#endcard h2 { margin: 0; font: 700 120px/1.02 var(--font); letter-spacing: -.045em; }
#endcard h2 .g { color: var(--green); }
#endcard p { margin: 0; font: 400 30px/1.3 var(--font); color: var(--fg2); }
#endcard .cta { display: inline-flex; align-items: center; gap: 10px; height: 64px; padding: 0 32px; border-radius: 16px; background: var(--fg); color: #F6F7ED; font: 600 22px/1 var(--font); }
#endcard .foot { position: absolute; bottom: 28px; font: 400 15px/1 var(--mono); color: var(--fg3); }
</style>
</head>
<body>
<div id="stage">
  <div id="world"><div class="obj" id="deskobj"><div id="desk"></div></div></div>
    <div id="scrim"></div>
  <div id="hud">
    <div id="lockup"><b class="mark"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#001F3F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg></b><span class="name"></span></div>
    <div id="title"><h1></h1><p></p></div>
    <div id="rail"></div>
    <div class="cap" id="cap"><div class="num"></div><h2></h2><p></p></div>
    <svg id="arrows" width="1920" height="1080"></svg>
    <div id="notes"></div>
    <div id="taps"></div>
    <div class="cursor" id="cur-you"><svg width="26" height="30" viewBox="0 0 26 30"><path d="M2 2 L2 24 L8 18.5 L12.5 28 L16.5 26.2 L12.2 17 L20.5 17 Z" fill="#001F3F" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="pill">Akshat</span></div>
    <div id="endcard"><b class="mark"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#001F3F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg></b><h2></h2><p></p></div>
  </div>
</div>
<script src="engine.js"></script>
<script src="film.js"></script>
</body>
</html>
