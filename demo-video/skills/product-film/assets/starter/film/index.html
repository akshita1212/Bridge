<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Starter film</title>
<style>
/* Rebrand here: colours, fonts and the title/end-card type come from the brand's own website (see references/brand-moments.md). */
:root { --ground: #0d0b0a; --fg: #f4efe9; --fg2: #b9b1a8; --fg3: #8a8078; --accent: #df695c; --end-bg: #f8f2ed; --end-fg: #0a0a0a;
  --font: "Helvetica Neue", Arial, sans-serif; --voice: Georgia, "Times New Roman", serif; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
body { font-family: var(--font); color: var(--fg); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(90% 80% at 80% 10%, rgba(223,105,92,.22), transparent 60%), var(--ground); }
#vignette { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.55)); pointer-events: none; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.obj { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
/* the frozen product screen: its iframe is the real app, frozen by tools/snap.mjs */
#desk { width: 1470px; height: 860px; border-radius: 18px; overflow: hidden; background: #0a0a0a;
  box-shadow: 0 0 0 1px rgba(244,239,233,.10), 0 40px 120px -30px rgba(0,0,0,.85), 0 12px 40px rgba(0,0,0,.45); }
#desk iframe { position: absolute; left: 0; top: 0; width: 1470px; height: 860px; border: 0; visibility: hidden; }
#scrim { position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: linear-gradient(90deg, rgba(13,11,10,.97) 0, rgba(13,11,10,.93) 540px, rgba(13,11,10,.55) 640px, rgba(13,11,10,0) 760px); }
#hud { position: absolute; inset: 0; pointer-events: none; }
.cap { position: absolute; left: 112px; top: 0; width: 470px; opacity: 0; }
.cap .num { font: 600 15px/1 var(--font); letter-spacing: .14em; color: var(--accent); font-variant-numeric: tabular-nums; }
.cap h2 { margin: 18px 0 0; font: 700 54px/1.04 var(--font); letter-spacing: -.035em; }
.cap p { margin: 20px 0 0; font: 400 23px/1.38 var(--font); color: var(--fg2); }
.w { display: inline-block; white-space: pre; }
#rail { position: absolute; left: 52px; top: 50%; display: flex; flex-direction: column; align-items: center; gap: 12px; transform: translateY(-50%);
  font: 600 12px/1 var(--font); letter-spacing: .06em; color: var(--fg3); opacity: 0; }
#rail i { display: block; width: 14px; height: 2px; border-radius: 1px; background: rgba(244,239,233,.22); }
#rail b { font-weight: 600; color: var(--fg); }
.cursor { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; }
.cursor svg { position: absolute; left: -3px; top: -2px; overflow: visible; }
.cursor .pill { position: absolute; left: 22px; top: 22px; padding: 6px 11px 7px; border-radius: 999px; font: 600 14px/1 var(--font); white-space: nowrap; background: var(--accent); color: #fff; }
.ripple { position: absolute; left: 0; top: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,.9); }
.tap { position: absolute; left: 0; top: 0; border-radius: 50%; background: rgba(255,255,255,.28); box-shadow: 0 0 0 2px rgba(255,255,255,.75); }
.note { position: absolute; left: 0; top: 0; font: 600 20px/1.2 var(--font); color: var(--fg); white-space: nowrap; opacity: 0; }
.note small { display: block; margin-top: 4px; font: 500 15px/1.25 var(--font); color: var(--fg2); }
#arrows { position: absolute; inset: 0; overflow: visible; color: var(--fg); }
/* the title card: the lockup arrives big, then steps back as the headline arrives (the headline leads) */
#lockup { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 22px; transform-origin: 50% 50%; white-space: nowrap; }
#lockup .mark { width: 92px; height: 92px; border-radius: 28px; background: var(--accent); }
#lockup .name { font: 700 104px/1 var(--font); letter-spacing: -.045em; }
#title { position: absolute; left: 0; width: 1920px; top: 470px; text-align: center; }
#title h1 { margin: 0; font: 700 84px/1.02 var(--font); letter-spacing: -.045em; }
#title p { margin: 22px 0 0; font: italic 400 36px/1.2 var(--voice); color: var(--fg2); }
/* the end card: a light page rises over the dark, the closing line arrives word by word */
#endcard { position: absolute; inset: 0; background: var(--end-bg); color: var(--end-fg); visibility: hidden; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 22px; text-align: center; box-shadow: 0 -40px 90px rgba(0,0,0,.45); }
#endcard h2 { margin: 0; font: 700 96px/1.02 var(--font); letter-spacing: -.045em; }
#endcard p { margin: 0; font: italic 400 40px/1.2 var(--voice); color: #6c6865; }
#endcard .cta { display: inline-flex; align-items: center; height: 60px; padding: 0 30px; border-radius: 999px; background: var(--end-fg); color: #fff; font: 600 20px/1 var(--font); }
#endcard .foot { position: absolute; bottom: 26px; font: 400 15px/1 var(--font); color: #8a8078; }
</style>
</head>
<body>
<div id="stage">
  <div id="world"><div class="obj" id="deskobj"><div id="desk"></div></div></div>
  <div id="vignette"></div>
  <div id="scrim"></div>
  <div id="hud">
    <div id="lockup"><b class="mark"></b><span class="name">Acme</span></div>
    <div id="title"><h1></h1><p></p></div>
    <div id="rail"></div>
    <div class="cap" id="cap"><div class="num"></div><h2></h2><p></p></div>
    <svg id="arrows" width="1920" height="1080"></svg>
    <div id="notes"></div>
    <div id="taps"></div>
    <div class="cursor" id="cur-you"><svg width="26" height="30" viewBox="0 0 26 30"><path d="M2 2 L2 24 L8 18.5 L12.5 28 L16.5 26.2 L12.2 17 L20.5 17 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="pill">You</span></div>
    <div id="endcard"><h2></h2><p></p><span class="cta">Start a demo</span><span class="foot">© Acme · Music credit goes here when the licence asks for it</span></div>
  </div>
</div>
<script src="engine.js"></script>
<script src="film.js"></script>
</body>
</html>
